<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Albatross</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/productCard.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="main-content">
        <div class="home-categories">
            <section class="category">
                <div class="category-header">
                    <h2>Most Loved</h2>
                    <a href="search.html?sort=popular" class="see-more">see more</a>
                </div>
                <div class="product-grid" id="most-loved-grid"></div>
            </section>
            <section class="category">
                <div class="category-header">
                    <h2>Home Appliances</h2>
                    <a href="search.html?type=appliances" class="see-more">see more</a>
                </div>
                <div class="product-grid" id="appliances"></div>
            </section>
        </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="js/pages/home.js"></script>
    <script src="js/common/navbar.js"></script>
    <script>
        fetch("components/navbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;
                return fetch("modals/address-modal.html");
            })
            .then(res => res.text())
            .then(html => {
                document.body.insertAdjacentHTML("beforeend", html);
                initNavbar();
            })
            .catch(err => console.error("Navbar load error:", err));
    </script>
    <script>
        fetch("components/footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("footer").innerHTML = html;
            })
            .catch(err => console.error("Footer load error:", err));
    </script>
</body>
</html>
